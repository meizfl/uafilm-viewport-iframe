<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewport Proside TMDB(UaFilms API)</title>
    <link type="image/x-icon" href="./favicon.svg" rel="shortcut icon">
    <link type="Image/x-icon" href="./favicon.svg" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link href="./main.css" rel="stylesheet">
  </head>
  <body>
    <div id="player" class="vp-player">
      <div class="js-video-container vp-video-container"></div>

      <!-- Top panel: series title + Season / Episode / Voice switchers -->
      <div class="js-top-panel vp-top-panel">
        <div class="js-series-title vp-top-panel__title"></div>
        <div class="vp-top-panel__selectors">
          <label class="vp-select-wrap">
            <span class="vp-select-label">Сезон</span>
            <select class="js-select-season vp-select"></select>
          </label>
          <label class="vp-select-wrap">
            <span class="vp-select-label">Серія</span>
            <select class="js-select-episode vp-select"></select>
          </label>
          <label class="vp-select-wrap">
            <span class="vp-select-label">Озвучка</span>
            <select class="js-select-voice vp-select"></select>
          </label>
        </div>
      </div>

      <!-- Big centered play button -->
      <button class="js-big-play vp-big-play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="#fff">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <div class="js-control-panel vp-control-panel">
        <div class="vp-progress-area">
          <div class="js-progress vp-progress-bar">
            <div class="js-progress-slider vp-progress-bar__filled"></div>
            <div class="vp-progress-bar__handle"></div>
          </div>
        </div>

        <div class="vp-controls-row">
          <div class="vp-controls-left">
            <button class="js-play-pause vp-btn" type="button" aria-label="Play">
              <svg class="js-icon-play" viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg class="js-icon-pause" viewBox="0 0 24 24" width="24" height="24" fill="#fff" style="display:none">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </button>

            <div class="vp-volume">
              <button class="js-mute-toggle vp-btn" type="button" aria-label="Mute">
                <svg class="js-icon-volume" viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg class="js-icon-muted" viewBox="0 0 24 24" width="24" height="24" fill="#fff" style="display:none">
                  <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
              </button>
              <div class="js-volume-slider vp-volume-slider" title="Volume">
                <div class="js-volume-track vp-volume-slider__track">
                  <div class="js-volume-filled vp-volume-slider__filled"></div>
                  <div class="js-volume-handle vp-volume-slider__handle"></div>
                </div>
              </div>
            </div>

            <div class="vp-time">
              <span class="js-current-time">0:00</span>
              <span class="vp-time-sep"> / </span>
              <span class="js-duration">0:00</span>
            </div>
          </div>

          <div class="vp-controls-right">
            <div class="js-settings-wrap vp-settings-wrap">
              <button class="js-settings-btn vp-btn" type="button" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                  <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
              </button>
              <div class="js-settings-menu vp-settings-menu" hidden>
                <!-- panels injected by JS -->
              </div>
            </div>
            <button class="js-fullscreen-button vp-btn" type="button" aria-label="Fullscreen">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="./player.js"></script>

    <script type="text/javascript">
      var DEMO_PLAYLIST = (function () {
        var demoSrc = '';
        function makeSeason(seasonNum, episodesCount) {
          var episodes = [];
          for (var i = 1; i <= episodesCount; i++) {
            episodes.push({ name: 'Episode ' + i, src: demoSrc });
          }
          return { name: 'Season ' + seasonNum, episodes: episodes };
        }
        return {
          title: 'Demo Series',
          translations: [
            { name: 'Dubbed', seasons: [makeSeason(1, 3), makeSeason(2, 2)] },
            { name: 'Original + Subtitles', seasons: [makeSeason(1, 3)] }
          ]
        };
      })();
    </script>

    <script type="text/javascript">
      (function () {
        const params = new URLSearchParams(window.location.search);
        const API_BASE = (params.get('api') || 'https://filmapi.proside.pp.ua').replace(/\/$/, '');
        const tmdb = params.get('tmdb') || params.get('id');
        const mediaType = (params.get('type') || 'movie').toLowerCase(); // movie | tv
        const season = params.get('season');
        const episode = params.get('episode');
        const voice = params.get('voice');
        const provider = params.get('provider'); // preferred provider name
        const srcDirect = params.get('src');
        const playlistUrl = params.get('playlist');
        const isDemo = params.get('demo') === '1';

        let playlist = null;
        if (isDemo) {
          playlist = DEMO_PLAYLIST;
        } else if (playlistUrl) {
          playlist = fetch(playlistUrl).then(function (r) { return r.json(); });
        } else if (window.PLAYER_PLAYLIST) {
          playlist = window.PLAYER_PLAYLIST;
        }

        const playerOpts = {
          elementId: 'player',
          src: srcDirect || '',
          playlist: playlist,
          apiBase: API_BASE,
          storageKey: tmdb
            ? 'tmdb|' + mediaType + '|' + tmdb
            : (playlistUrl ? 'playlist|' + playlistUrl : (srcDirect ? 'src|' + srcDirect : '')),
          initialSelection: {
            voice: voice,
            season: season,
            episode: episode,
            provider: provider
          }
        };

        // If TMDB id given — resolve streams from backend, then create player
        if (tmdb && !srcDirect) {
          playerOpts.tmdb = {
            id: tmdb,
            type: mediaType === 'tv' || mediaType === 'series' ? 'tv' : 'movie',
            season: season ? parseInt(season, 10) : undefined,
            episode: episode ? parseInt(episode, 10) : undefined,
            provider: provider || undefined,
            voice: voice || undefined
          };
        }

        createPlayer(playerOpts);
      })();
    </script>
  </body>
</html>
